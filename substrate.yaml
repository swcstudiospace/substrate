# substrate.yaml
# Source of truth for per-surface substrate projection.
# Run: bun packages/projector/src/substrate-yaml-projector.ts
# Generates per-surface env blocks with SUBSTRATE_URL, SUBSTRATE_TOKEN (value for surface), brief command etc.
# Used by infra, systemd units, per-agent setups for hermes/omp/muse/grok-bot.
# Additive, fail-open. Tokens are looked up from env names at projection time or runtime.

version: "0.1"
default_url: "http://127.0.0.1:7410"

surfaces:
  - name: hermes
    token_env: SUBSTRATE_TOKEN_HERMES
    brief: "substrate brief --surface hermes --write || true"
    emit_example: "substrate emit --kind session.start --summary 'hermes session' --surface hermes || true"
    notes: "hermes-eng-board + prompt-uplift; use for pre_llm and eng events"

  - name: omp
    token_env: SUBSTRATE_TOKEN_OMP
    brief: "substrate brief --surface omp --write || true"
    emit_example: "substrate emit --kind prompt --summary 'omp prompt' --surface omp || true"
    notes: "add memory.brief to discovery; .substrate/BRIEF.md fallback"

  - name: muse
    token_env: SUBSTRATE_TOKEN_MUSE
    brief: "substrate brief --surface muse --write || true"
    emit_example: "substrate emit --kind session.start --summary 'muse session' --surface muse || true"
    notes: "falls back to .substrate/BRIEF.md ; no hook API"

  - name: grok-build
    token_env: SUBSTRATE_TOKEN_GROK_BUILD
    brief: "substrate brief --surface grok-build --write || true"
    emit_example: "substrate emit --kind session.end --summary 'grok build' --surface grok-build || true"
    notes: "UserPromptSubmit hook; collector at packages/collectors/src/grok.ts"

  - name: grok-bot
    token_env: SUBSTRATE_TOKEN_GROK_BOT
    brief: "substrate brief --surface grok-bot --write || true"
    emit_example: "substrate emit --kind handoff --summary 'grokbot handoff' --surface grok-bot || true"
    notes: "production loop: brief on open, substrate-only, via connector v0.4"

  - name: cursor
    token_env: SUBSTRATE_TOKEN_CURSOR
    brief: "substrate brief --surface cursor --write || true"
    emit_example: "substrate emit --kind tool.call --summary 'cursor tool' --surface cursor || true"
    notes: "projected via cursor.ts hooks.json"

  - name: claude-code
    token_env: SUBSTRATE_TOKEN_CLAUDE_CODE
    brief: "substrate brief --surface claude-code --write || true"
    emit_example: "substrate emit --kind prompt --summary 'claude prompt' --surface claude-code || true"
    notes: "ultrathink hooks"

# Future: rivet-agentos, codex etc.
# Cross Apps on Substrate (hindsight, ragflow, dragonfly, timescale, greptimedb, es):
# All use substrate for brief/memory/events/graph_claim/ledger/A2A.
# Bearer: SUBSTRATE_TOKEN_* per service (Railway secrets).
# Dragonfly: cache, snapshots, outbox, breakers (see governance).
# Tailscale for private networking.
# SOTA: no silos, teachables on Solana, SLOs, redaction.
# Verify: substrate evidence + route all surfaces.
