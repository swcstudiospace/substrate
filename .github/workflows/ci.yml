name: CI

# The repository's verification gate. `bun run verify` runs the same commands locally
# (docs/ci.md) and scripts/verify.test.ts fails if the two drift apart. CI adds the
# Postgres-backed tests that skip on a machine without a database.
#
# Every job runs on a GitHub-hosted `ubuntu-latest` runner. CI_ENABLED is still the switch: while the
# repository variable is unset every job is skipped, which GitHub reports as a skipped (not failed) check.
# `gh variable set CI_ENABLED --body true` turns the gate on; `gh variable delete CI_ENABLED`
# is the kill switch.
#
# Pull requests from forks never reach the runner: a fork's code would otherwise run in this repository's CI.
#
# The scratch Postgres 16 is not a service container: the local `scratch-postgres` action starts a
# throwaway cluster from the PostgreSQL 16 binaries on the image (initdb, pg_ctl; the action puts
# them on PATH first) in RUNNER_TEMP, on 127.0.0.1 and a port picked free per job, so parallel jobs
# on one runner never clash. It exports SUBSTRATE_TEST_PG_URL.
#
# The third job, `boot-gate`, is report-only and opt-in twice over: it needs CI_ENABLED and its own
# repository variable BOOT_GATE. Its rehearsal harness starts Docker containers, so keep
# BOOT_GATE unset until the harness has a native-process store backend.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests and repo locks
    if: vars.CI_ENABLED == 'true' && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `bun run check:phase-close` diffs the vocabulary against a baseline commit, so
          # it needs history, not a one-commit clone.
          fetch-depth: 0
          persist-credentials: false

      # A throwaway database that lives for this job. It exports SUBSTRATE_TEST_PG_URL, which
      # un-skips the live index tests (leases, memory, search, graph bindings).
      - name: Start a scratch Postgres 16
        uses: ./.github/actions/scratch-postgres

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.0"

      - name: Cache Bun's package cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (lockfile must be current)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint (Biome)
        run: bunx biome lint --reporter=summary .

      - name: Tests
        run: bun test

      - name: Install uv (pinned release, checksum-verified)
        uses: ./.github/actions/install-uv

      - name: Python suites (miner, dispatcher)
        run: uv run --no-project --with httpx==0.28.1 --with pytest==9.1.1 python -m pytest packages/miner/tests packages/dispatcher/tests

      - name: Repo locks (event vocabulary, store lock, audit policy)
        run: bun run check:phase-close

      - name: Stop the scratch Postgres
        if: always()
        uses: ./.github/actions/scratch-postgres
        with:
          mode: stop

  dependency-audit:
    name: Known-vulnerability audit
    # Advisories appear without any change here, so this never gates a pull request. It runs
    # on main, on demand and weekly; a red run is the signal to upgrade.
    if: vars.CI_ENABLED == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies (lockfile must be current)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Gate the audit (fail on an unlisted high or critical advisory)
        run: bun scripts/audit-gate.ts

  boot-gate:
    name: Boot and prove (report-only)
    # Boots this commit against scratch Postgres and GreptimeDB containers on the runner's Docker
    # (keep BOOT_GATE unset until the harness gains a native-process backend)
    # (the rehearsal harness), proves it over HTTP, freezes the scratch ledger for a real outage,
    # and removes everything. `continue-on-error` keeps it advisory: a red run is a report, never a
    # block. It starts containers, so it is off until `gh variable set BOOT_GATE --body true`, and it
    # does not run on the weekly schedule. No `services:` block: the harness owns its own stores.
    if: vars.CI_ENABLED == 'true' && vars.BOOT_GATE == 'true' && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies (the harness refuses a checkout without node_modules)
        run: bun install --frozen-lockfile

      - name: Boot the commit against scratch stores and prove it
        run: bun run gate:boot
