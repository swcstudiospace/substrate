# Proposed Railway config for substrate governance plane (Phase 0.5)
# This is a TEMPLATE only. Do not apply directly. Route via A11 for actual infra.
# All backing stores remain on the existing Railway project; substrate consumes via private URLs.
# No breaking changes to v0.2 services.

version: "1"

services:
  substrate-mcp:
    # existing + new env
    env:
      SUBSTRATE_POLICY_PATH: /etc/substrate/policy.yaml   # mounted config
      DRAGONFLY_URL: ${DRAGONFLY_PRIVATE_URL}           # ioredis compatible, private net
      # existing: GREPTIME_*, PG_*, RAGFLOW_*
    # policy volume (from repo or secret)
    volumes:
      - type: secret
        name: substrate-policy
        mount: /etc/substrate/policy.yaml
    # health includes governance
    healthcheck:
      path: /healthz
      # governance adds: policy loaded, dragonfly reachable (degraded ok)

  dragonfly:
    # existing Dragonfly service on Railway (private)
    # substrate uses it for:
    # - brief snapshots (graph:<id> -> brief json, ttl 15m)
    # - write outbox (when greptime down)
    # - circuit breakers
    # - lease state mirror + policy cache
    # No direct app access except through substrate or approved surfaces.

# Cross-app wiring (additive)
# hindsight-*: SUBSTRATE_MCP_URL + surface bearer; emit events for evidence
# ragflow-*: docs.search via substrate MCP only; ingest redacted
# All use the same policy rules (surface=app-name)

# Run `substrate verify` + dragonfly smoke after apply.
# See docs/governance.md and ADR-0002, ADR-0004, ADR-0005.
