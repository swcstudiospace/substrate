[Service]
# Bridge environment. Installed to
# /etc/systemd/system/substrate-skills-bridge.service.d/10-environment.conf
# Create /etc/substrate/substrate-bridge.env (root-owned, mode 0600) with only the
# keys this tick reads (infra/vps/README.md). It must never define a
# single-token variable: the bridge refuses to run while one is set and serves
# hermes, omp and grok-build from the tokens dir instead. Do not point this at
# substrate.env.
EnvironmentFile=/etc/substrate/substrate-bridge.env
