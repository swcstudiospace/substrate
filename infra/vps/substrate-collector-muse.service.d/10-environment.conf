[Service]
# Collector environment. Installed to
# /etc/systemd/system/substrate-collector-muse.service.d/10-environment.conf
# Create /etc/substrate/collector-muse.env (root-owned, mode 0600) with only the
# keys this process reads (infra/vps/README.md). Do not point this at substrate.env.
EnvironmentFile=/etc/substrate/collector-muse.env
