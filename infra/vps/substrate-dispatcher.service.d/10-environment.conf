[Service]
# Dispatcher environment. Installed to
# /etc/systemd/system/substrate-dispatcher.service.d/10-environment.conf
# Create /etc/substrate/dispatcher.env (root-owned, mode 0600) with only the
# keys this process reads (SUBSTRATE_DISPATCH_DISABLED, SUBSTRATE_URL,
# SUBSTRATE_TOKEN_SUBSTRATE, SUBSTRATE_TOKEN_HERMES, LINEAR_API_KEY:
# names only in infra/vps/README.md). Do not point this at substrate.env.
EnvironmentFile=/etc/substrate/dispatcher.env
