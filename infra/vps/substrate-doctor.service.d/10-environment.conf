[Service]
# Runtime doctor environment. Installed to
# /etc/systemd/system/substrate-doctor.service.d/10-environment.conf
# The file is root-owned and mode 0600. The doctor is a host job in the same
# trust domain as the server, so it loads the shared substrate.env: that is
# where SUBSTRATE_TOKEN_SUBSTRATE (its bearer for the `substrate` surface) and
# SUBSTRATE_URL live, and it is the file the doctor checks for legacy keys by
# NAME. Emitting is off until the operator adds the line below; without it
# the doctor only reports to the journal.
EnvironmentFile=/etc/substrate/substrate.env
# SUBSTRATE_DOCTOR_EMIT=1 turns on the one-warning-per-drift-class emit to the
# ledger. Set it here, on the doctor's own drop-in, not in substrate.env: the
# server never needs it, and the switch stays visible beside the unit.
#Environment=SUBSTRATE_DOCTOR_EMIT=1
