[Service]
# Ledger archive job environment. Installed to
# /etc/systemd/system/substrate-ledger-archive.service.d/10-environment.conf
# The file is root-owned and mode 0600. The archive job is a store client in
# the same trust domain as the server, so it loads the shared substrate.env
# (the Greptime credentials) — not a collector file.
EnvironmentFile=/etc/substrate/substrate.env
# The archive directory is an operator decision: an off-box mount, never the
# root disk and never the release tree. Set it here, or as
# SUBSTRATE_LEDGER_ARCHIVE_DIR in substrate.env (where `substrate ledger
# archive` without --out also reads it). With it unset the ExecStart expands
# to `--out` and nothing, and the command refuses by name without writing a
# byte. Example, after mounting:
#   Environment=SUBSTRATE_LEDGER_ARCHIVE_DIR=/mnt/ledger-archive
