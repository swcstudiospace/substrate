[Service]
# Sync environment. Installed to
# /etc/systemd/system/substrate-skills-sync.service.d/10-environment.conf
# Create /etc/substrate/skills-sync.env (root-owned, mode 0600) with only the
# keys this tick reads (infra/vps/README.md). Do not point this at substrate.env.
EnvironmentFile=/etc/substrate/skills-sync.env
