[Service]
# Failure alert environment. Installed to
# /etc/systemd/system/substrate-alert@.service.d/10-environment.conf
# The file is root-owned and mode 0600. The alert is a host job in the same
# trust domain as the server, so it loads the shared substrate.env: that is
# where SUBSTRATE_TOKEN_SUBSTRATE (its bearer for the `substrate` surface) and
# SUBSTRATE_URL live, exactly as for substrate-doctor.service.
EnvironmentFile=/etc/substrate/substrate.env
