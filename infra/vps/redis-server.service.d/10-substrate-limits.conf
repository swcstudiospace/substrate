[Service]
# Hard memory ceiling on the loopback redis substrate-mcp caches in (uplift-2
# R7). Installed to /etc/systemd/system/redis-server.service.d/10-substrate-limits.conf
# beside the distro unit, then `systemctl daemon-reload && systemctl restart
# redis-server`. redis-substrate.conf caps the dataset at 256mb with LRU
# eviction; this is the ceiling on the whole process (dataset plus
# fragmentation and client buffers), 3x that, where the kernel ends it rather
# than letting it push the host further into swap (12 of 15 GiB in use when
# measured 2026-10-13). The cache tolerates the restart: docs/data-planes.md.
MemoryMax=768M
