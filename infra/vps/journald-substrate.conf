# journald size cap for the substrate host (uplift-4 S3). NOT installed by any
# script or by the repo's code: an operator step.
#
#   install -d -m 0755 /etc/systemd/journald.conf.d
#   install -m 0644 infra/vps/journald-substrate.conf /etc/systemd/journald.conf.d/10-substrate.conf
#   systemctl restart systemd-journald
#   journalctl --disk-usage
#
# Before this file the journal had no ceiling in the repo (329.6 MB measured
# 2026-10-13 on a / at 94 %): a unit stuck in a restart loop paid for itself in
# journal bytes (substrate-dispatcher reached NRestarts=114888 once), and the
# only reclaim was the manual `journalctl --vacuum-size` in
# docs/runbooks/disk-pressure.md step 6. SystemMaxUse bounds the persistent
# journal (/var/log/journal); journald deletes the oldest archived files itself
# when the total reaches it. The runtime doctor's journal row compares the
# journal against SUBSTRATE_JOURNAL_MAX_MB (default 400, the value below) and
# only reports.
#
# Rollback: remove /etc/systemd/journald.conf.d/10-substrate.conf and restart
# systemd-journald; already-vacuumed entries do not come back.
[Journal]
SystemMaxUse=400M
