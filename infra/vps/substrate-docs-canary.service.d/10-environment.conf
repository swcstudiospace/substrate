[Service]
# Docs canary environment. Installed to
# /etc/systemd/system/substrate-docs-canary.service.d/10-environment.conf
# The file is root-owned and mode 0600. The canary is a host job in the same
# trust domain as the server, so it loads the shared substrate.env: that is
# where SUBSTRATE_TOKEN_OMP (the search bearer) and SUBSTRATE_TOKEN_SUBSTRATE
# (the bearer the warning is posted with) live. Values are never in this repo.
EnvironmentFile=/etc/substrate/substrate.env
# The canary stays OFF until the operator writes both lines below, on this
# drop-in and not in substrate.env: the server never needs them, and the switch
# stays visible beside the unit. Without them the job exits 2 naming what is
# missing and opens no socket.
#
# SUBSTRATE_DOCS_CANARY=1 is the opt-in.
#Environment=SUBSTRATE_DOCS_CANARY=1
# The operator-attested manifest: a JSON file {"sha256": "...", "dataset_commit": "..."}
# written after ingesting fixtures/docs-golden/corpus under that dataset commit
# (`bun scripts/docs-golden.ts --manifest` prints the sha256). The canary refuses
# when its sha256 is not the corpus on disk, and counts a citation from any other
# dataset commit as a regression. See docs/docs-search-ingest.md.
#Environment=SUBSTRATE_DOCS_CANARY_MANIFEST=/etc/substrate/docs-canary-manifest.json
