[Service]
# Anchor job environment. Installed to
# /etc/systemd/system/substrate-anchor.service.d/10-environment.conf
# The file is root-owned and mode 0600. The anchor job is a store client in the
# same trust domain as the server, so it loads the shared substrate.env
# (Greptime credentials plus the SOLANA_* lines) — not a collector file.
EnvironmentFile=/etc/substrate/substrate.env
