# redis-substrate.conf — the loopback redis substrate-mcp uses as its cache.
#
# Installed by the operator to /etc/redis/redis-substrate.conf and pulled in
# from /etc/redis/redis.conf with a trailing line
#
#     include /etc/redis/redis-substrate.conf
#
# (a later `include` wins over an earlier directive, so put it last). Nothing
# here is automated; infra/vps/README.md carries the install step.
#
# Why these values: the cache tolerates loss by design. docs/data-planes.md
# (cache row) names it a read-through cache for the brief, memory search and a
# graph view, with TTLs of 60–600 s, and states that "a Dragonfly outage returns
# the same answers, uncached". Nothing that must survive a restart — queues,
# locks, sessions — is allowed in it. So it needs no persistence at all, and on
# a host measured at 95 % disk (2026-10-13) an RDB snapshot is a write it must
# not make. Measured use the same day: 1.0 MB, 8 keys, with `maxmemory 0` and
# `noeviction` — an unbounded cache that would refuse writes rather than evict.
#
# maxmemory 256mb is roughly 250x today's use. The policy is volatile-lru, not
# allkeys-lru, and the difference is an invariant of the cache's key scheme
# (packages/mcp-server/src/cache.ts): every cached answer and brief snapshot is
# written with a TTL, while the generation counters `substrate:v1:gen:*` are
# plain INCR keys with none. A write invalidates its answers by bumping a
# counter — the answer key embeds the generation, so the old entry simply
# misses. A reader that finds no counter treats it as 0. Under allkeys-lru the
# counter, touched once per write, is colder than a busy answer and can be
# evicted first; the generation then reads as 0 again and a generation-0 answer
# still inside its TTL becomes the hit — a stale brief revived by the eviction
# that was meant to free memory. volatile-lru evicts only keys that carry a
# TTL, so counters are never candidates and the invariant "a bump is visible
# until the entry expires" holds under pressure. When nothing with a TTL is
# left to evict, writes are refused (OOM) rather than a counter removed; the
# cache is fail-open and the brief composes from the stores. The
# redis-server.service.d drop-in beside this file (MemoryMax=768M) is the hard
# ceiling on the process itself, leaving room for fragmentation and client
# buffers above maxmemory.

# Bound the dataset; evict the coldest *expiring* key, never a counter.
maxmemory 256mb
maxmemory-policy volatile-lru

# No persistence: the cache is rebuilt from the stores on the next miss.
save ""
appendonly no

# Loopback only. substrate-mcp is on this host; nothing else is a client.
bind 127.0.0.1 -::1
