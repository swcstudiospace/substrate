[Service]
# Index sweep job environment. Installed to
# /etc/systemd/system/substrate-index-sweep.service.d/10-environment.conf
# The file is root-owned and mode 0600. The sweep job is a store client in the
# same trust domain as the server, so it loads the shared substrate.env
# (SUBSTRATE_PG_URL plus the Greptime credentials) — not a collector file.
EnvironmentFile=/etc/substrate/substrate.env
# The mode lives on the unit, not in substrate.env, so the server's environment
# never carries a delete switch. dry-run reports and removes nothing. Only an
# operator changes this to apply, after the snapshot step in
# docs/runbooks/quarantine-spike.md; `off` disables the job without masking it.
Environment=SUBSTRATE_INDEX_SWEEP=dry-run
