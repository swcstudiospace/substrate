# substrate.swcstudio.space — public edge for substrate-mcp.
# The process stays on 127.0.0.1:7410. This file is not enabled until
# DNS and a certificate for the name exist, and until SUBSTRATE_ALLOW_ANONYMOUS=0.
# Do not proxy /livez or /events/stream: both treat a local nginx peer as loopback.
# Sibling vhosts (desk, claude, grokclaude, paperclip) are not in this file.
# HSTS matches desk.swcstudio.space.

server {
    listen 80;
    listen [::]:80;
    server_name substrate.swcstudio.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 187.77.130.10:443 ssl http2;
    server_name substrate.swcstudio.space;

    ssl_certificate     /etc/letsencrypt/live/substrate.swcstudio.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/substrate.swcstudio.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    location = /livez {
        return 404;
    }

    location = /events/stream {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:7410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
