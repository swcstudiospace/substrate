[project]
name = "substrate-dispatcher"
version = "0.1.0"
description = "Turns a Linear dispatch:<surface> label into a Hermes session in a per-Graph-ID worktree"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
substrate-dispatcher = "substrate_dispatcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substrate_dispatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: hits real Linear or substrate-mcp",
]
