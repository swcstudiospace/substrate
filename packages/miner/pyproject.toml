[project]
name = "substrate-miner"
version = "0.1.0"
description = "Hermes pending-skill bridge (staged skill_manage writes → library PRs), queued-proposal drain and the miner cron precheck"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
substrate-miner = "substrate_miner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substrate_miner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
